<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Visagem: sobreviva até o amanhecer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1230;--panel:#161d45;--panel2:#212a62;--line:#33408a;--ink:#ece6d3;--dim:#929bc9;--moon:#f4e7b6;--acc:#f2c14e;--acc2:#b5862a;--leather:#6a3d1c;--red:#e05545;--green:#86d46f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img{image-rendering:pixelated;image-rendering:crisp-edges}
.hidden{display:none!important}

/* ---------- telas ---------- */
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  pointer-events:auto;background:rgba(5,8,26,.62);overflow-y:auto;text-align:center;justify-content:safe center}
.screen.on{display:flex}
#s-menu{background:transparent}
h1{font-size:clamp(52px,15vh,124px);font-weight:400;letter-spacing:.08em;color:var(--moon);line-height:.85;
  text-shadow:4px 4px 0 var(--leather),8px 8px 0 rgba(0,0,0,.45)}
h2{font-size:clamp(30px,8vh,52px);font-weight:400;color:var(--moon);text-shadow:3px 3px 0 #000;line-height:1}
.sub{font-size:clamp(19px,5vh,30px);color:var(--dim);margin:-2px 0 6px}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.btn{font-family:inherit;font-size:clamp(21px,5.4vh,30px);line-height:1.1;padding:4px 22px;background:var(--acc);color:#1a1226;border:none;cursor:pointer;min-width:210px;
  box-shadow:inset -3px -3px 0 var(--acc2),0 0 0 3px #1a1226,5px 5px 0 3px rgba(0,0,0,.45)}
.btn:active{transform:translate(2px,2px)}
.btn:focus-visible{outline:3px dashed var(--moon);outline-offset:5px}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset -3px -3px 0 #121845,0 0 0 3px #0a0e26,5px 5px 0 3px rgba(0,0,0,.4)}
.btn.small{min-width:0;font-size:22px;padding:2px 14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.rapbox{display:inline-flex;align-items:center;gap:8px;font-size:26px;color:var(--acc)}
.rapbox img{width:22px;height:16px}
#menu-foot{position:absolute;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;font-size:20px;color:var(--dim);pointer-events:none}
#moon{display:none;position:absolute;top:max(14px,env(safe-area-inset-top));right:max(26px,env(safe-area-inset-right));width:clamp(56px,16vh,110px);height:auto;pointer-events:none}

.panel{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:10px 12px}
.char{width:clamp(160px,27vw,230px);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:19px;line-height:1.05}
.char b{font-size:28px;font-weight:400;color:var(--moon)}
.char .cimg{width:48px;height:56px;margin:4px 0}
.char .lk{color:var(--dim);font-size:18px;margin-top:2px}
.char .btn{min-width:0;width:100%;font-size:22px;margin-top:8px}
.char.locked .cimg{filter:brightness(.25)}
.list{display:flex;flex-direction:column;gap:8px;width:min(620px,92vw);max-height:62vh;overflow-y:auto;padding:4px 8px 8px 4px}
.item{display:flex;align-items:center;gap:12px;text-align:left;font-size:20px;line-height:1.05}
.item img{width:28px;height:28px}
.item .tx{flex:1}
.item .tx b{display:block;font-weight:400;font-size:25px;color:var(--moon)}
.item .tx span{color:var(--dim)}
.item.done .tx b{color:var(--green)}
.item.off{opacity:.55}
.pips{letter-spacing:2px;color:var(--acc)}

.card{font-family:inherit;color:var(--ink);background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 rgba(0,0,0,.45);
  width:clamp(150px,24vw,215px);padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:18px;line-height:1.05}
.card:hover,.card:focus-visible{border-color:var(--acc);outline:none;transform:translateY(-3px)}
.card .ci{width:40px;height:40px;margin-bottom:4px}
.card .ct{color:var(--acc);font-size:17px}
.card b{font-weight:400;font-size:25px;color:var(--moon)}
.card .cd{color:var(--dim)}
.card.evo{border-color:var(--acc);background:#2a2350}
.card .k{color:var(--dim);font-size:15px;margin-top:4px}
#over-stats{display:grid;grid-template-columns:auto auto;gap:2px 26px;font-size:24px;text-align:left;margin:4px 0 8px}
#over-stats span:nth-child(even){color:var(--moon);text-align:right}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#xpbar{position:absolute;top:0;left:0;right:0;height:13px;background:#090c22;border-bottom:2px solid #000}
#xpfill{height:100%;width:0;background:#5d93d6;box-shadow:inset 0 -3px 0 #3b6ea5}
#lvl{position:absolute;right:max(10px,env(safe-area-inset-right));top:-4px;font-size:19px;text-shadow:1px 1px 0 #000}
#slots{position:absolute;top:18px;left:max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:2px}
#slots>div{display:flex}
.slot{width:24px;height:24px;background:rgba(9,12,34,.78);border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;margin-right:3px}
.slot.ev{border-color:var(--acc)}
.slot img{width:16px;height:16px}
.slot i{position:absolute;right:-4px;bottom:-7px;font-style:normal;font-size:14px;color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000}
#timer{position:absolute;left:50%;top:13px;transform:translateX(-50%);font-size:clamp(28px,7vh,40px);color:var(--moon);text-shadow:2px 2px 0 #000}
#stats{position:absolute;top:16px;right:max(10px,env(safe-area-inset-right));text-align:right;font-size:20px;line-height:1;text-shadow:2px 2px 0 #000;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#stats .rapbox{font-size:20px}
#stats .rapbox img{width:16px;height:12px}
#pausebtn{pointer-events:auto;margin-top:6px;font-family:inherit;font-size:22px;width:36px;height:32px;background:rgba(22,29,69,.85);color:var(--ink);border:2px solid var(--line);cursor:pointer}
#bossbar{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:min(56vw,420px);text-align:center;font-size:20px;text-shadow:2px 2px 0 #000;display:none}
#bossbar div{height:8px;background:#200b0b;border:2px solid #000;margin-top:1px}
#bossbar div i{display:block;height:100%;width:100%;background:var(--red)}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(34px,9vh,62px);color:var(--moon);text-shadow:3px 3px 0 #000,0 0 18px rgba(224,85,69,.6);z-index:4;pointer-events:none;opacity:0;transition:opacity .25s}
#banner.on{opacity:1}
#toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:3px solid var(--acc);padding:3px 14px;font-size:22px;z-index:9;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#rotate{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:28px;text-align:center;padding:24px}
#rotate.show{display:flex}
#rotate .ph{width:46px;height:78px;border:4px solid var(--moon);border-radius:6px;animation:rot 1.8s steps(6) infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}.card:hover{transform:none}}
#chest-slots{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cslot{width:clamp(130px,22vw,190px);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:18px;line-height:1.05}
.cslot .cbox{width:56px;height:56px;background:#0a0e26;border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.cslot .cbox img{width:36px;height:36px}
.cslot b{font-weight:400;font-size:23px;color:var(--moon)}
.cslot span{color:var(--dim)}
.cslot.evo .cbox{box-shadow:0 0 16px var(--acc)}
#over-dmg{display:flex;flex-direction:column;gap:3px;width:min(400px,80vw);margin:4px 0 8px}
#over-dmg .dh{font-size:20px;color:var(--dim);text-align:left}
.drow{display:flex;align-items:center;gap:8px;font-size:19px}
.drow img{width:16px;height:16px}
.drow .dn{width:9em;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .db{flex:1;height:8px;background:#0a0e26}
.drow .db i{display:block;height:100%;background:var(--acc)}
.drow .dv{width:4.6em;text-align:right;color:var(--moon)}
#buffs{color:var(--acc);font-size:18px}
.card{position:relative;background:#182050;box-shadow:inset 0 0 0 2px #0a0e26,inset 0 0 0 4px rgba(242,193,78,.14),5px 5px 0 rgba(0,0,0,.45)}
.card::before,.card::after{content:'';position:absolute;top:-6px;width:9px;height:9px;background:var(--line);transform:rotate(45deg)}
.card::before{left:-6px}.card::after{right:-6px}
.card .ci{width:44px;height:44px;padding:6px;background:#0a0e26;border:2px solid var(--line);box-sizing:content-box;margin-bottom:6px}
.card.k-arma .ct{color:#f2c14e}.card.k-item .ct{color:#9fc9f2}.card.k-cura .ct{color:#86d46f}
.card.k-arma::before,.card.k-arma::after{background:#b5862a}.card.k-item::before,.card.k-item::after{background:#3b6ea5}
.card.evo{background:#2a2350;box-shadow:inset 0 0 0 2px #0a0e26,inset 0 0 0 4px rgba(242,193,78,.4),0 0 18px rgba(242,193,78,.4),5px 5px 0 rgba(0,0,0,.45)}
.card.evo::before,.card.evo::after{background:var(--acc)}
.card.evo .ci{border-color:var(--acc)}
#charlist{flex-wrap:nowrap;max-width:100%;overflow-x:auto;padding:4px 6px 10px;justify-content:safe center}
#charlist .char{flex:0 0 auto}
@media (max-height:520px){
  h2{font-size:clamp(26px,7vh,40px)}
  .screen{gap:6px}
  .char{width:clamp(150px,21vw,190px);font-size:17px;padding:8px}
  .char b{font-size:24px}
  .char .cimg{width:34px;height:40px;margin:2px 0}
  .char .btn{font-size:19px;margin-top:5px}
  .char .skin{font-size:16px}
  .char .lk{font-size:15px}
  .list{max-height:56vh}
  .card{padding:8px 8px 10px;font-size:16px}
  .card b{font-size:22px}
  .card .ci{width:32px;height:32px}
}
#over-dance{width:60px;height:70px;animation:danca .9s steps(4) infinite}
@keyframes danca{0%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-8px) scaleX(1)}50%{transform:translateY(0) scaleX(-1)}75%{transform:translateY(-8px) scaleX(-1)}}
@media (prefers-reduced-motion:reduce){#over-dance{animation:none}}
.slot.gold{border-color:#ffd23f;box-shadow:0 0 6px #ffd23f}
#abil{position:absolute;right:max(2.5vh,env(safe-area-inset-right));bottom:calc(22vh + 10px);width:76px;height:76px;border-radius:50%;pointer-events:auto;background:rgba(22,29,69,.88);border:3px solid var(--acc);color:var(--moon);font-family:inherit;font-size:21px;line-height:1;overflow:hidden;cursor:pointer;padding:0}
#abil.cool{border-color:var(--line)}
#abil span{position:relative;z-index:1}
#abil i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(5,8,26,.72)}
#abil:focus-visible{outline:3px dashed var(--moon);outline-offset:3px}
#cut{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding:0 24px max(18px,env(safe-area-inset-bottom));pointer-events:auto;text-align:center;cursor:pointer}
#cut.on{display:flex}
#cut p{font-size:clamp(24px,6vh,36px);line-height:1.05;color:var(--moon);text-shadow:2px 2px 0 #000;max-width:760px;min-height:2.2em;margin:0}
#cut span{font-size:18px;color:var(--dim)}
.menu-grid{gap:12px;max-width:min(600px,92vw)}
#statlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:66vh}
#statlist .item{padding:6px 12px}
.menu-grid .btn{min-width:170px;font-size:clamp(19px,4.6vh,26px)}
.item .tx span{display:block}
.char .skin{font-size:18px;margin-top:6px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><div id="xpfill"></div><span id="lvl">Nv 1</span></div>
  <div id="slots"><div id="wslots"></div><div id="pslots"></div></div>
  <div id="timer">00:00</div>
  <div id="stats">
    <span id="kills">0 abates</span>
    <span class="rapbox"><img data-ico="rap" alt=""><span id="hud-rap">0</span></span>
    <span id="buffs"></span>
    <button id="pausebtn" aria-label="Pausar">II</button>
  </div>
  <div id="bossbar"><span id="bossname"></span><div><i id="bossfill"></i></div></div>
  <button id="abil" aria-label="Habilidade"><span id="abil-name"></span><i id="abil-cd"></i></button>
</div>

<div id="ui">
  <section id="s-menu" class="screen">
    <img id="moon" alt="">
    <h1 id="title">VISAGEM</h1>
    <p class="sub">Sobreviva no sertão até o sol nascer</p>
    <div class="col">
      <button class="btn hidden" id="btn-continue">Continuar a noite</button>
      <button class="btn" data-go="chars">Jogar</button>
      <div class="row menu-grid">
        <button class="btn ghost" data-go="shop">Loja</button>
        <button class="btn ghost" data-go="ach">Conquistas</button>
        <button class="btn ghost" data-go="stats">Estatísticas</button>
        <button class="btn ghost" data-go="figs">Figurinhas</button>
        <button class="btn ghost" id="btn-sound">Som ligado</button>
        <button class="btn ghost hidden" id="btn-install">Instalar no celular</button>
      </div>
    </div>
    <p id="tip" class="sub" style="font-size:20px;max-width:min(680px,90vw);margin-top:6px"></p>
    <div id="menu-foot"><span id="rec"></span><span class="rapbox"><img data-ico="rap" alt=""><span class="rapn">0</span></span></div>
  </section>

  <section id="s-chars" class="screen">
    <h2>Quem vai encarar a noite?</h2>
    <div id="charlist" class="row"></div>
    <div class="row" style="align-items:center;gap:22px;margin-top:6px">
      <button class="btn ghost small" data-go="menu">Voltar</button>
      <button class="btn ghost small hidden" id="btn-nm">Modo Normal</button>
      <span class="rapbox"><img data-ico="rap" alt=""><span class="rapn">0</span></span>
    </div>
  </section>

  <section id="s-shop" class="screen">
    <h2>Loja de melhorias</h2>
    <span class="rapbox"><img data-ico="rap" alt=""><span class="rapn">0</span></span>
    <div id="shoplist" class="list"></div>
    <button class="btn ghost small" data-go="menu">Voltar</button>
  </section>

  <section id="s-ach" class="screen">
    <h2>Conquistas</h2>
    <div id="achlist" class="list"></div>
    <button class="btn ghost small" data-go="menu">Voltar</button>
  </section>

  <section id="s-figs" class="screen">
    <h2>Figurinhas das lendas</h2>
    <p class="sub" id="figs-sub"></p>
    <div id="figlist" class="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:60vh"></div>
    <button class="btn ghost small" data-go="menu">Voltar</button>
  </section>

  <section id="s-stats" class="screen">
    <h2>Estatísticas</h2>
    <div id="statlist" class="list"></div>
    <button class="btn ghost small" data-go="menu">Voltar</button>
  </section>

  <section id="s-roleta" class="screen">
    <h2>Roleta do Coronel</h2>
    <p class="sub" id="rol-sub"></p>
    <div class="panel" id="rol-wheel" style="min-width:min(440px,86vw);font-size:30px;color:var(--moon);padding:14px 20px"></div>
    <div class="row" id="rol-bets"></div>
    <button class="btn ghost small" id="rol-exit">Sair</button>
  </section>

  <section id="s-level" class="screen">
    <h2>Subiu de nível!</h2>
    <div id="cards" class="row"></div>
  </section>

  <section id="s-chest" class="screen">
    <h2>Baú do Coronel</h2>
    <div id="chest-slots"></div>
    <button class="btn" id="btn-chest" disabled>Pegar</button>
  </section>

  <section id="s-pause" class="screen">
    <h2>Pausado</h2>
    <div id="pause-build" class="list" style="max-height:52vh"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btn-resume">Continuar</button>
      <button class="btn ghost" id="btn-quit">Desistir da noite</button>
    </div>
  </section>

  <section id="s-over" class="screen">
    <img id="over-dance" class="hidden" alt="">
    <h2 id="over-title"></h2>
    <p class="sub" id="over-sub"></p>
    <div class="row" style="align-items:flex-start;gap:28px"><div id="over-stats"></div><div id="over-dmg"></div></div>
    <div class="row">
      <button class="btn" id="btn-again">Jogar de novo</button>
      <button class="btn ghost" data-go="menu">Menu</button>
    </div>
  </section>
</div>

<div id="banner"></div>
<div id="toast"></div>
<div id="cut"><p id="cut-txt"></p><span>Toque para pular</span></div>
<div id="rotate"><div class="ph"></div>Gire o celular para jogar deitado</div>

<script src="js/base.js?v=1"></script>
<script src="js/dados.js?v=1"></script>
<script src="js/mundo.js?v=1"></script>
<script src="js/armas.js?v=1"></script>
<script src="js/jogo.js?v=1"></script>
<script src="js/desenho.js?v=1"></script>
<script src="js/telas.js?v=1"></script>
</body>
</html>
