<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1230">
<link rel="icon" href="../icon-192.png">
<title>Reinado do Sertão · DLC do Visagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1230;--panel:#161d45;--panel2:#212a62;--line:#33408a;--ink:#ece6d3;--dim:#929bc9;--moon:#f4e7b6;--acc:#f2c14e;--acc2:#b5862a;--red:#e05545;--green:#86d46f;--k:#07060f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'VT323',ui-monospace,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
img{image-rendering:pixelated}
#cv{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(7,6,15,0) 52%,rgba(7,6,15,.55) 100%)}
.hidden{display:none!important}
.sh{text-shadow:2px 2px 0 var(--k)}
button{font-family:inherit;cursor:pointer;color:inherit}
.btn{font-size:clamp(18px,5vh,28px);line-height:1.1;padding:3px 18px;background:var(--acc);color:#1a1226;border:none;box-shadow:inset -3px -3px 0 var(--acc2),0 0 0 3px var(--k),4px 4px 0 3px rgba(0,0,0,.45)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset -3px -3px 0 #121845,0 0 0 3px var(--k),4px 4px 0 3px rgba(0,0,0,.4)}
.btn.red{background:#a8432f;color:var(--ink);box-shadow:inset -3px -3px 0 #6e2420,0 0 0 3px var(--k)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.panel{background:rgba(22,29,69,.95);border:3px solid var(--line);box-shadow:0 0 0 3px var(--k),5px 5px 0 3px rgba(0,0,0,.45)}
/* ---------- telas ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:3vh max(3vw,env(safe-area-inset-right)) 3vh max(3vw,env(safe-area-inset-left));z-index:20}
.screen.on{display:flex}
.screen.dim{background:rgba(7,6,15,.72)}
h1{font-weight:400;font-size:clamp(34px,12vh,78px);line-height:.95;color:var(--moon);text-shadow:4px 4px 0 #6a3d1c,7px 7px 0 var(--k);text-align:center}
h2{font-weight:400;font-size:clamp(26px,7.5vh,46px);color:var(--moon);text-shadow:3px 3px 0 #6a3d1c,5px 5px 0 var(--k);text-align:center}
.sub{font-size:clamp(17px,4.6vh,26px);color:var(--dim);text-align:center}
.col{display:flex;flex-direction:column;gap:2.4vh;align-items:center}
.row{display:flex;gap:2vh;align-items:center;justify-content:center;flex-wrap:wrap}
#s-title .col .btn{min-width:min(340px,60vw)}
/* senhores */
#lordgrid{display:grid;grid-template-columns:repeat(5,auto);gap:1.4vh}
.lt{width:clamp(56px,15vh,96px);height:clamp(62px,16.5vh,106px);padding:0;border:3px solid var(--line);box-shadow:0 0 0 2px var(--k);background:var(--k);position:relative;overflow:hidden}
.lt img{width:100%;height:100%;display:block}
.lt.on{border-color:var(--acc)}
.lt.lock img{filter:brightness(0) opacity(.75)}
.lt.lock::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7vh;color:var(--dim)}
#lorddet{width:min(46vw,520px);padding:1.4vh 1.6vh;display:flex;flex-direction:column;gap:.8vh;font-size:clamp(15px,3.9vh,22px);line-height:1.1}
#lorddet b{color:var(--acc);font-weight:400}
.lname{font-size:clamp(22px,6vh,34px);color:var(--moon)}
.chips{display:flex;gap:.8vh;flex-wrap:wrap}
.chip{font-size:clamp(13px,3.3vh,18px);padding:0 6px;background:#0f1430;border:2px solid var(--line)}
.diff{display:flex;gap:1vh}
.diff button{font-size:clamp(15px,4vh,22px);padding:2px 10px;background:#0f1430;border:2px solid var(--line)}
.diff button.on{background:var(--acc);color:#14111f;border-color:var(--acc)}
/* hud */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:max(1.2vh,env(safe-area-inset-top)) max(2vw,env(safe-area-inset-right)) 0 max(2vw,env(safe-area-inset-left));pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
.hl{display:flex;flex-direction:column;gap:.8vh;min-width:24vw}
.rap{display:flex;align-items:center;gap:8px;font-size:clamp(22px,6.4vh,38px);color:var(--ink)}
.rap img{height:clamp(14px,4vh,24px)}
.casa{display:flex;flex-direction:column;gap:2px;font-size:clamp(13px,3.4vh,19px);color:var(--dim)}
.bar{height:clamp(8px,2.4vh,14px);width:clamp(110px,24vw,240px);background:#4a1414;box-shadow:0 0 0 2px var(--k)}
.bar i{display:block;height:100%;background:linear-gradient(#a8e88a 0 30%,#86d46f 30%)}
.hm{display:flex;flex-direction:column;align-items:center;gap:.6vh}
#timeline{display:flex;align-items:center;gap:.9vh}
.ts{width:clamp(20px,5.6vh,34px);height:clamp(20px,5.6vh,34px);border:2px solid #8a8478;box-shadow:0 0 0 2px var(--k);overflow:hidden;background:#0f1430;display:flex;align-items:center;justify-content:center;opacity:.9}
.ts img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.ts.ico img{width:70%;height:70%;object-fit:contain}
.ts.now{width:clamp(30px,8.4vh,50px);height:clamp(30px,8.4vh,50px);border-color:var(--red);opacity:1}
.ts.boss{border-color:#9fe07a}.ts.atk{border-color:var(--acc)}
#h-year{font-size:clamp(18px,5.4vh,32px);color:var(--ink)}
#h-year small{font-size:.7em;color:#ff8a7a}
.hr{display:flex;gap:1.2vh;min-width:24vw;justify-content:flex-end}
.ib{font-size:clamp(16px,4.4vh,24px);padding:2px 10px;background:var(--panel2);border:none;box-shadow:inset -2px -2px 0 #121845,0 0 0 3px var(--k)}
/* plano */
#plan{position:fixed;inset:0;pointer-events:none;z-index:9}
#plan>*{pointer-events:auto}
#hand{position:fixed;left:50%;bottom:1.4vh;transform:translateX(-50%);display:flex;gap:2vh;align-items:flex-end}
.card{width:clamp(104px,31vh,200px);background:#122a32;border:3px solid #3f9fb0;box-shadow:0 0 0 3px var(--k),inset 0 0 0 2px #1f4a55;padding:.7vh .9vh;display:flex;flex-direction:column;gap:.6vh;align-items:stretch;transition:transform .12s;position:relative;text-align:center}
.card .ch{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;background:#1f4a55;box-shadow:0 0 0 2px var(--k)}
.card .cn{font-size:clamp(11px,3.2vh,20px);color:#f4efe0;text-shadow:2px 2px 0 var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct{position:absolute;right:1.2vh;top:calc(.7vh + clamp(16px,4.4vh,26px));font-size:clamp(9px,2.3vh,13px);color:#3f9fb0;background:rgba(7,6,15,.75);padding:0 4px}
.card .ca{width:100%;aspect-ratio:2/1;object-fit:cover;object-position:50% 85%;display:block;box-shadow:0 0 0 2px var(--k)}
.card .cd{min-height:2.1em;font-size:clamp(11px,3vh,17px);line-height:1.05;color:#14111f;background:#8fd0d8;box-shadow:0 0 0 2px var(--k);padding:2px 4px}
.card .tr{position:absolute;left:1.2vh;top:calc(.7vh + clamp(16px,4.4vh,26px));font-size:clamp(9px,2.4vh,13px);background:rgba(7,6,15,.75);color:#e8d9b8;padding:0 4px}
.card .lv{position:absolute;top:-1.6vh;right:-1vh;font-size:clamp(11px,2.8vh,16px);background:var(--acc);color:#14111f;padding:0 5px;box-shadow:0 0 0 2px var(--k)}
.card.sel{transform:translateY(-10%);box-shadow:0 0 0 3px var(--k),0 0 24px rgba(242,193,78,.7)}
.card.used{filter:grayscale(1) brightness(.5)}
.card.t-bencao{background:#14203a;border-color:#7fb2e5}.card.t-bencao .ch{background:#22406a}.card.t-bencao .ct{color:#7fb2e5}.card.t-bencao .cd{background:#a8c8f0}
.card.t-decreto{background:#10301e;border-color:#3fbf6a}.card.t-decreto .ch{background:#1c5a34}.card.t-decreto .ct{color:#3fbf6a}.card.t-decreto .cd{background:#7fe0a0}
.card.t-batalha{background:#2a0c14;border-color:#e05545}.card.t-batalha .ch{background:#4a1418}.card.t-batalha .ct{color:#ff8a7a}.card.t-batalha .cd{background:#f0a090}
.card.t-torre{background:#222226;border-color:#9a948a}.card.t-torre .ch{background:#3a3a40}.card.t-torre .ct{color:#c9c4ba}.card.t-torre .cd{background:#c9c4ba}
.card.r-rara{outline:2px solid #c9c9d6;outline-offset:-7px}
.card.r-lendaria{border-color:var(--acc);box-shadow:0 0 0 3px var(--k),0 0 16px rgba(242,193,78,.55)}
.card.r-lendaria .ch{background:linear-gradient(90deg,#6a4a14,#b5862a,#6a4a14)}
#lcol{position:fixed;left:max(2vw,env(safe-area-inset-left));bottom:2vh;display:flex;flex-direction:column;gap:1.6vh;align-items:flex-start}
#b-power{width:clamp(48px,13vh,80px);height:clamp(48px,13vh,80px);border-radius:50%;border:3px solid var(--k);box-shadow:inset 0 0 0 3px var(--acc);background:#141c3a;overflow:hidden;padding:0;position:relative}
#b-power img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
#b-power span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,6,15,.65);font-size:clamp(14px,4vh,22px);color:var(--ink)}
#b-power.ready{box-shadow:inset 0 0 0 3px var(--acc),0 0 16px rgba(242,193,78,.8)}
.rlab{font-size:clamp(12px,3.2vh,18px);color:var(--dim)}
#reserve{display:flex;gap:1vh}
#reserve .slot{width:clamp(56px,15vh,96px);height:clamp(40px,10vh,64px);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(11px,2.8vh,16px);color:var(--dim);text-align:center;background:rgba(7,6,15,.5);padding:2px;line-height:1}
#reserve .slot.full{border:3px solid var(--acc);color:var(--ink);background:rgba(22,29,69,.92)}
#reserve .slot.sel{box-shadow:0 0 14px rgba(242,193,78,.8)}
#rcol{position:fixed;right:max(2vw,env(safe-area-inset-right));bottom:2.4vh;display:flex;flex-direction:column;gap:1.6vh;align-items:flex-end}
#rcol .btn{font-size:clamp(15px,4.2vh,24px);padding:2px 12px;min-width:clamp(110px,26vh,180px)}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:clamp(80px,22vh,150px);font-size:clamp(15px,4.2vh,24px);color:var(--moon);text-shadow:2px 2px 0 var(--k),-2px -2px 0 var(--k);text-align:center;pointer-events:none;white-space:nowrap}
#tileinfo{position:fixed;right:max(2vw,env(safe-area-inset-right));top:clamp(70px,20vh,140px);width:clamp(170px,36vh,260px);padding:1vh 1.2vh;font-size:clamp(13px,3.5vh,19px);line-height:1.1;display:flex;flex-direction:column;gap:.5vh}
#tileinfo b{color:var(--acc);font-weight:400}
#tileinfo .btn{font-size:clamp(14px,3.8vh,20px);padding:1px 8px;align-self:flex-start}
/* batalha */
#bhud{position:fixed;inset:0;pointer-events:none;z-index:9}
#bhud>*{pointer-events:auto}
.btop{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:2vh;padding:max(1vh,env(safe-area-inset-top)) max(2vw,env(safe-area-inset-right)) 1vh max(2vw,env(safe-area-inset-left));background:rgba(13,18,48,.88);box-shadow:0 3px 0 var(--k)}
.bp{width:clamp(32px,9vh,56px);height:clamp(35px,10vh,62px);box-shadow:0 0 0 2px var(--k),0 0 0 4px var(--acc);overflow:hidden}
.bp.r{box-shadow:0 0 0 2px var(--k),0 0 0 4px var(--red)}
.bp img{width:100%;height:100%;display:block}
.bs{flex:1;display:flex;flex-direction:column;gap:.5vh;font-size:clamp(14px,3.8vh,22px)}
.bs.r{align-items:flex-end}
.bs .bar{width:100%}
.bs.r .bar{display:flex;justify-content:flex-end}.bs.r .bar i{background:linear-gradient(#ff8a7a 0 30%,#e05545 30%)}
.bmid{display:flex;flex-direction:column;align-items:center;line-height:1}
.bmid b{font-size:clamp(20px,5.6vh,32px);color:var(--acc);font-weight:400}
.bbot{position:fixed;left:max(2vw,env(safe-area-inset-left));right:max(2vw,env(safe-area-inset-right));bottom:2vh;display:flex;gap:1.6vh;align-items:flex-end}
.spd button{font-size:clamp(14px,4vh,22px);width:clamp(34px,9vh,52px);padding:2px 0;background:#161d45;border:none;box-shadow:0 0 0 3px var(--k)}
.spd button.on{background:var(--acc);color:#14111f}
#b-bdec{display:flex;gap:1vh}
/* cutscene */
#s-cut{background:rgba(7,6,15,.85);flex-direction:row;gap:4vw}
#cutimg{width:clamp(120px,46vh,300px);height:auto;aspect-ratio:40/44;box-shadow:0 0 0 4px var(--k),0 0 0 8px var(--acc)}
.cutbox{max-width:min(52vw,560px);display:flex;flex-direction:column;gap:2vh}
#cutname{font-size:clamp(26px,8vh,46px);color:var(--moon);text-shadow:3px 3px 0 #6a3d1c,5px 5px 0 var(--k)}
#cuttxt{font-size:clamp(18px,5.6vh,32px);line-height:1.15;min-height:3.4em}
/* listas */
.rivlist{display:flex;gap:1.4vh;flex-wrap:wrap;justify-content:center;max-width:94vw}
.riv{width:clamp(84px,21vh,128px);padding:.8vh;display:flex;flex-direction:column;align-items:center;gap:.4vh;background:rgba(22,29,69,.95);border:3px solid var(--line);box-shadow:0 0 0 3px var(--k);font-size:clamp(12px,3.2vh,18px);line-height:1;text-align:center}
.riv img{width:clamp(48px,12vh,80px);box-shadow:0 0 0 2px var(--k)}
.riv.dead{filter:grayscale(1) brightness(.55)}
.riv.on{border-color:var(--acc)}
.hearts{color:var(--red);letter-spacing:2px}
.choice{display:flex;gap:2vh;justify-content:center;flex-wrap:wrap}
.choice .card{transform:none;cursor:pointer}
#news{max-width:min(80vw,640px);padding:1.4vh 2vh;font-size:clamp(16px,4.4vh,24px);line-height:1.2;display:flex;flex-direction:column;gap:.6vh}
#news b{color:var(--acc);font-weight:400}
.tree{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh;max-width:min(92vw,900px)}
.node{padding:.8vh 1vh;background:rgba(22,29,69,.95);border:3px solid var(--line);box-shadow:0 0 0 3px var(--k);font-size:clamp(12px,3.2vh,18px);line-height:1.05;text-align:left;display:flex;flex-direction:column;gap:.3vh}
.node b{color:var(--moon);font-weight:400;font-size:1.15em}
.node.own{border-color:var(--green)}.node.can{border-color:var(--acc)}.node.lock{opacity:.5}
table.recs{border-collapse:collapse;font-size:clamp(14px,3.8vh,22px)}
table.recs td,table.recs th{padding:2px 12px;border-bottom:2px solid var(--line);font-weight:400;text-align:left}
table.recs th{color:var(--acc)}
#rotate{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;font-size:28px;padding:20px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>

<div id="hud" class="hidden">
  <div class="hl">
    <div class="rap sh"><img id="rapico" alt=""><span id="h-rap">0</span></div>
    <div class="casa sh"><div class="bar"><i id="h-casab"></i></div><span id="h-casa">Casa-grande</span></div>
  </div>
  <div class="hm"><div id="timeline"></div><div id="h-year" class="sh"></div></div>
  <div class="hr"><button class="ib" id="b-rivais">Rivais</button><button class="ib" id="b-pause">II</button></div>
</div>

<div id="plan" class="hidden">
  <div id="hint"></div>
  <div id="lcol">
    <button id="b-power" title="Poder do senhor"><img id="powimg" alt=""><span id="powcd"></span></button>
    <div class="rlab sh">Reserva</div><div id="reserve"></div>
  </div>
  <div id="hand"></div>
  <div id="rcol">
    <button class="btn ghost" id="b-swap">Trocar</button>
    <button class="btn ghost" id="b-keep">Guardar</button>
    <button class="btn ghost" id="b-heal">Reformar</button>
    <button class="btn" id="b-end">Seguir</button>
  </div>
  <div id="tileinfo" class="panel hidden"></div>
</div>

<div id="bhud" class="hidden">
  <div class="btop">
    <div class="bp" id="bp0"><img id="bpi0" alt=""></div>
    <div class="bs sh"><span id="bn0"></span><div class="bar"><i id="bb0"></i></div></div>
    <div class="bmid sh"><b id="byear"></b><span id="btime"></span></div>
    <div class="bs r sh"><span id="bn1"></span><div class="bar"><i id="bb1"></i></div></div>
    <div class="bp r" id="bp1"><img id="bpi1" alt=""></div>
  </div>
  <div class="bbot">
    <div class="spd" id="spd"><button data-s="1">1x</button><button data-s="2" class="on">2x</button><button data-s="4">4x</button></div>
    <span style="flex:1"></span>
    <div id="b-bdec"></div>
    <button class="btn" id="b-bpow">Poder</button>
  </div>
</div>

<section id="s-title" class="screen dim">
  <h1>Reinado do Sertão</h1>
  <p class="sub">DLC do Visagem · nove senhores disputam o sertão</p>
  <div class="col">
    <button class="btn hidden" id="t-cont">Continuar o reinado</button>
    <button class="btn" id="t-new">Novo reinado</button>
    <div class="row"><button class="btn ghost" id="t-tree">Árvore do Engenho</button><button class="btn ghost" id="t-recs">Recordes</button></div>
    <button class="btn ghost" id="t-back">Voltar ao Visagem</button>
  </div>
  <p class="sub" id="t-foot" style="font-size:clamp(14px,3.6vh,20px)"></p>
</section>

<section id="s-lords" class="screen dim">
  <h2>Escolha seu senhor</h2>
  <div class="row" style="align-items:stretch">
    <div id="lordgrid"></div>
    <div id="lorddet" class="panel"></div>
  </div>
  <div class="row"><button class="btn ghost" id="l-back">Voltar</button><button class="btn" id="l-go">Começar</button></div>
</section>

<section id="s-cut" class="screen">
  <img id="cutimg" alt="">
  <div class="cutbox"><div id="cutname"></div><div id="cuttxt" class="sh"></div><div class="row" style="justify-content:flex-start"><button class="btn" id="cut-next">Seguir</button><button class="btn ghost" id="cut-skip">Pular</button></div></div>
</section>

<section id="s-raid" class="screen dim">
  <h2>Sua vez de atacar</h2>
  <p class="sub">Vencer tira uma vida do senhor e você rouba uma carta dele</p>
  <div class="rivlist" id="raidlist"></div>
  <div class="row"><button class="btn ghost" id="raid-rest">Descansar (+4 rapaduras)</button><button class="btn" id="raid-go" disabled>Atacar</button></div>
</section>

<section id="s-res" class="screen dim">
  <h2 id="res-t"></h2>
  <div id="res-b" class="sub"></div>
  <div class="choice" id="res-choice"></div>
  <button class="btn" id="res-ok">Seguir</button>
</section>

<section id="s-news" class="screen dim">
  <h2 id="news-t">Notícias do sertão</h2>
  <div id="news" class="panel"></div>
  <button class="btn" id="news-ok">Seguir</button>
</section>

<section id="s-rivais" class="screen">
  <div class="rivlist" id="rivlist" style="position:fixed;top:2vh;left:0;right:0"></div>
  <div class="panel" id="rivdet" style="position:fixed;right:2vw;bottom:2vh;width:min(40vw,420px);padding:1vh 1.4vh;font-size:clamp(14px,3.6vh,20px);line-height:1.1"></div>
  <button class="btn" id="riv-close" style="position:fixed;left:2vw;bottom:2vh">Voltar</button>
</section>

<section id="s-end" class="screen dim">
  <h1 id="end-t"></h1>
  <div id="end-b" class="sub" style="max-width:80vw"></div>
  <div class="row"><button class="btn hidden" id="end-inf">Continuar sem fim</button><button class="btn" id="end-ok">Menu</button></div>
</section>

<section id="s-tree" class="screen dim">
  <h2>Árvore do Engenho</h2>
  <p class="sub" id="tree-g"></p>
  <div class="tree" id="tree"></div>
  <button class="btn ghost" id="tree-back">Voltar</button>
</section>

<section id="s-recs" class="screen dim">
  <h2>Recordes</h2>
